<script>
/* ================= NIGHTMARE MODE: random production incidents on a live FortiGate + Azure environment =================
 * A known-good "production" baseline gets one or more random faults planted (on either side of the tunnel).
 * The user only sees a ticket and customer-impact monitoring. Fix it and the next incident is harder.
 * Every generated incident is proven solvable first: the planted faults are fixed on a copy and the
 * environment must come back healthy, or the incident is re-rolled. No DOM here. */
const NIGHTMARE = (() => {
  const NM = {};
  const AZ = SIM.AZ;
  const PSK = 'Talvex-S2S-Lab!2026';
  const rnd = n => Math.floor(Math.random() * n);
  const pick = a => a[rnd(a.length)];
  const lc = s => String(s || '').toLowerCase();
  /* one plausible-looking character change: the kind of typo that survives a quick glance */
  const typo = s => {
    const look = { S: '5', s: '5', l: '1', L: '1', o: '0', O: '0', a: '@', e: '3', i: '1', I: 'l', '2': 'Z', '6': '9', '0': 'O', '1': 'l', '-': '_', '!': '1', 'T': '7' };
    for (let tries = 0; tries < 20; tries++) {
      const i = 1 + rnd(Math.max(1, s.length - 2)), ch = s[i], rep = look[ch];
      if (rep && rep !== ch) return s.slice(0, i) + rep + s.slice(i + 1);
    }
    return s.slice(0, -1) + (s.slice(-1) === '6' ? '7' : '6');
  };
  const BASE_CLI = `config system global
set hostname TLX-HQ-FW01
end
config firewall policy
delete 3
end
config firewall address
edit LAN-Net
set subnet 10.10.10.0 255.255.255.0
next
edit Azure-Hub
set subnet 10.100.0.0 255.255.0.0
next
edit FS01
set subnet 10.10.10.50 255.255.255.255
next
end
config vpn ipsec phase1-interface
edit To-Azure
set interface "port1"
set ike-version 2
set peertype any
set net-device disable
set proposal aes256-sha256
set dhgrp 14
set remote-gw 198.51.100.25
set psksecret ${PSK}
set keylife 28800
set dpd on-idle
set nattraversal enable
next
end
config vpn ipsec phase2-interface
edit To-Azure-P2
set phase1name "To-Azure"
set proposal aes256-sha256
set pfs disable
next
end
config system interface
edit To-Azure
set ip 169.254.21.2 255.255.255.255
set remote-ip 169.254.21.1 255.255.255.255
next
end
config router static
edit 0
set dst 10.100.0.254 255.255.255.255
set device "To-Azure"
next
end
config router bgp
set as 65010
set router-id 203.0.113.10
config neighbor
edit 10.100.0.254
set remote-as 65515
next
end
config network
edit 1
set prefix 10.10.10.0 255.255.255.0
next
end
end
config firewall policy
edit 0
set name "LAN-to-Azure"
set srcintf "port2"
set dstintf "To-Azure"
set srcaddr "LAN-Net"
set dstaddr "Azure-Hub"
set service "HTTPS" "RDP" "SMB"
set schedule "always"
set action accept
set logtraffic all
next
edit 0
set name "Azure-to-FS01"
set srcintf "To-Azure"
set dstintf "port2"
set srcaddr "Azure-Hub"
set dstaddr "FS01"
set service "SMB"
set schedule "always"
set action accept
set logtraffic all
next
end`;

  /* the Talvex "production" network: clean office firewall, tunnel + BGP up, Azure hub with its own gateway */
  NM.baseline = () => {
    const st = SIM.seed(), sh = new CLI.Shell(() => st, () => { });
    for (const line of BASE_CLI.split('\n')) sh.exec(line);
    AZ.deleteRg(st, 'rg-rick-test');
    const steps = [
      () => AZ.createRg(st, { name: 'rg-talvex-hub-scus', location: 'southcentralus' }),
      () => AZ.createVnet(st, { rg: 'rg-talvex-hub-scus', name: 'vnet-talvex-hub', location: 'southcentralus', prefixes: '10.100.0.0/16' }),
      () => AZ.createSubnet(st, 'rg-talvex-hub-scus', 'vnet-talvex-hub', { name: 'GatewaySubnet', prefix: '10.100.0.224/27' }),
      () => AZ.createSubnet(st, 'rg-talvex-hub-scus', 'vnet-talvex-hub', { name: 'snet-app', prefix: '10.100.1.0/24' }),
      () => AZ.createVm(st, { rg: 'rg-talvex-hub-scus', name: 'AZ-VM-APP01', location: 'southcentralus', image: 'win2022', size: 'Standard_B2s', vnetRg: 'rg-talvex-hub-scus', vnet: 'vnet-talvex-hub', subnet: 'snet-app', ipAlloc: 'Static', privateIp: '10.100.1.4' }),
      () => AZ.createGateway(st, { name: 'vgw-talvex-hub', vnetRg: 'rg-talvex-hub-scus', vnet: 'vnet-talvex-hub', sku: 'VpnGw1', bgp: true, asn: 65515 }),
      () => AZ.saveLng(st, { name: 'lng-talvex-office', rg: 'rg-talvex-hub-scus', ip: '203.0.113.10', space: '10.10.10.0/24', bgp: true, asn: 65010, bgpPeerIp: '169.254.21.2' }),
      () => AZ.saveConnection(st, { name: 'cn-talvex-office', gateway: 'vgw-talvex-hub', lng: 'lng-talvex-office', sharedKey: PSK, ike: 'IKEv2', enableBgp: true, policy: 'default' })
    ];
    for (const f of steps) { const e = f(); if (e) throw new Error('Nightmare baseline: ' + e); }
    st.azure.gateways[0].readyAt = 0;
    st.azure.activity = st.azure.activity.filter(a => !/rick/.test(a.rg));
    return st;
  };

  /* customer impact: what monitoring (and the users) see */
  NM.health = st => {
    const L = (srcintf, srcip, dstip, port) => { try { return SIM.lookup(st, { srcintf, srcip, dstip, proto: 'tcp', port }); } catch (e) { return {}; } };
    const a = L('port2', '10.10.10.20', '10.100.1.4', 443), b = L('To-Azure', '10.100.1.4', '10.10.10.50', 445), r = L('port2', '10.10.10.20', '10.100.1.4', 3389);
    const cs = SIM.azConn(st), bg = SIM.bgpStatus(st);
    return [
      { id: 'tun', label: 'Azure connection cn-talvex-office is Connected', ok: !!cs && cs.status === 'Connected' },
      { id: 'bgp', label: 'BGP session with the Azure gateway is up', ok: bg.some(n => n.up) },
      { id: 'app', label: 'Front office → AZ-VM-APP01 web app (HTTPS) answers', ok: a.verdict === 'accept' && a.egress === 'To-Azure' && !a.natIp && !!(a.far && a.far.ok) },
      { id: 'rdp', label: 'Front office → AZ-VM-APP01 remote desktop (RDP) answers', ok: r.verdict === 'accept' && r.egress === 'To-Azure' && !!(r.far && r.far.ok) },
      { id: 'smb', label: 'AZ-VM-APP01 → file server FS01 (SMB) allowed', ok: b.verdict === 'accept' && b.egress === 'port2' }
    ];
  };
  /* fixes that "work" but are not acceptable in production */
  NM.workarounds = st => {
    const live = st.policies.filter(p => p.status !== 'disable' && p.action === 'accept'), w = [];
    if (live.some(p => p.srcintf.includes('any') && p.dstintf.includes('any'))) w.push('An any-to-any allow rule is in place. It hides the real problem and opens the whole firewall.');
    if (live.some(p => (p.srcintf.includes('To-Azure') || p.dstintf.includes('To-Azure')) && p.srcaddr.includes('all') && p.dstaddr.includes('all') && p.service.includes('ALL'))) w.push('A wide-open rule to or from Azure (all addresses, all services) is in place. Scope it back down.');
    if (live.some(p => p.nat && p.dstintf.includes('To-Azure'))) w.push('NAT is on for traffic into the tunnel. Azure must see the real office addresses.');
    return w;
  };

  const p1 = st => st.vpn.phase1.find(p => p.name === 'To-Azure');
  const p2 = st => st.vpn.phase2.find(q => q.phase1 === 'To-Azure');
  const pol = (st, n) => st.policies.find(p => p.name === n);
  const cn = st => AZ.connection(st, 'cn-talvex-office');
  const lng = st => AZ.lng(st, 'lng-talvex-office');
  const vm = st => AZ.vmByName(st, 'AZ-VM-APP01');
  const who = () => pick(['admin via CLI(10.10.10.77)', 'admin via GUI(10.10.10.41)', 'contractor via SSH(10.10.10.99)']);
  const azWho = () => pick(['rick@talvex.example', 'azure-ops@talvex.example', 'svc-automation@talvex.example']);
  const fgLog = (st, lvl, what) => { if (lvl < 5) SIM.event(st, 'system', 'notice', `Configuration changed by ${who()}: ${what}`); };
  const azLog = (st, lvl, op, res) => { if (lvl < 5) AZ.log(st, op, res, 'rg-talvex-hub-scus', 'Succeeded', azWho()); };

  /* ---------- the fault catalog ---------- */
  NM.FAULTS = [
    { id: 'az-psk', ref: 'FGAZ-001', level: 1, side: 'Azure', slot: 'psk', title: 'Shared key changed on the Azure connection',
      inject: (st, lvl) => { const c = cn(st), bad = typo(PSK); c.sharedKey = bad; azLog(st, lvl, 'Create or update connection', c.name); return { bad }; },
      ticket: () => 'The Azure team rotated some secrets this morning. Since then nobody can reach the app server in Azure.',
      hints: () => ['Start with the tunnel. On the FortiGate, VPN → IPsec Tunnels shows the status and the exact reason.', 'AUTHENTICATION_FAILED means the two pre-shared keys differ. Which side changed today?', 'Compare the shared key on Azure connection cn-talvex-office with the FortiGate tunnel key, character by character.'],
      steps: p => ['FortiGate: VPN → IPsec Tunnels. To-Azure is down with IKE_AUTH: AUTHENTICATION_FAILED.', 'Azure view: Networking → Site-to-site VPN → Connection → Configuration.', `The shared key reads "${p.bad}". The FortiGate uses "${PSK}".`, 'Set the Azure shared key back to the FortiGate value and save. The tunnel comes up within a second.'],
      fix: st => { cn(st).sharedKey = PSK; },
      why: 'Rotating a pre-shared key on one end only is a classic outage. Rotate both ends in the same change window.' },
    { id: 'fg-psk', ref: 'FGAZ-001', level: 1, side: 'FortiGate', slot: 'psk', title: 'Pre-shared key changed on the FortiGate tunnel',
      inject: (st, lvl) => { const bad = typo(PSK); p1(st).psk = bad; fgLog(st, lvl, 'vpn.ipsec.phase1-interface To-Azure'); return { bad }; },
      ticket: () => 'A contractor tidied up the firewall last night. This morning the Azure app server is unreachable.',
      hints: () => ['Is the tunnel up? VPN → IPsec Tunnels on the FortiGate.', 'AUTHENTICATION_FAILED: the keys differ. Check the System Events log for who changed what.', 'The Azure connection still has the original key. The FortiGate tunnel key was edited.'],
      steps: p => ['FortiGate: VPN → IPsec Tunnels. To-Azure is down with AUTHENTICATION_FAILED.', 'Log & Report → Logs → System Events shows a change to the To-Azure tunnel.', `The tunnel key is now "${p.bad}". Azure still expects "${PSK}".`, `CLI: config vpn ipsec phase1-interface → edit To-Azure → set psksecret ${PSK} → next → end.`],
      fix: st => { p1(st).psk = PSK; },
      why: 'Unreviewed "cleanup" changes are one of the top causes of outages. Change control and a config diff would have caught this.' },
    { id: 'vm-off', level: 1, side: 'Azure', slot: 'vm', title: 'AZ-VM-APP01 was stopped (deallocated)',
      inject: (st, lvl) => { vm(st).power = 'deallocated'; azLog(st, lvl, 'Deallocate virtual machine', 'AZ-VM-APP01'); return {}; },
      ticket: () => 'The app server in Azure is not answering. The firewall team swears the tunnel is fine.',
      hints: () => ['The tunnel and BGP look healthy, so follow a packet: Policy Lookup from 10.10.10.20 to 10.100.1.4 on HTTPS.', 'Read the Azure step at the bottom of the lookup trace.', 'Azure view → Compute → Virtual machines. Check the status column.'],
      steps: () => ['Policy Lookup 10.10.10.20 → 10.100.1.4 TCP/443: the firewall accepts it, but the Azure step says the VM is deallocated.', 'Azure view → Compute → Virtual machines → AZ-VM-APP01 → Start.'],
      fix: st => { vm(st).power = 'running'; },
      why: 'Not every outage is the network. Prove the path end to end before changing firewall rules.' },
    { id: 'pol-off', ref: 'FGAZ-018', level: 1, side: 'FortiGate', slot: 'pol-lan', title: 'LAN-to-Azure policy disabled',
      inject: (st, lvl) => { pol(st, 'LAN-to-Azure').status = 'disable'; fgLog(st, lvl, 'firewall.policy LAN-to-Azure'); return {}; },
      ticket: () => 'Front office users cannot open the Azure app or remote into the server. The server team says Azure looks healthy.',
      hints: () => ['Policy Lookup 10.10.10.20 → 10.100.1.4 HTTPS shows which rule handles it.', 'A rule that is disabled is skipped. Look at the policy list status column.', 'Policy & Objects → Firewall Policy → LAN-to-Azure.'],
      steps: () => ['Policy Lookup shows the traffic falling to the implicit deny: LAN-to-Azure is skipped because it is disabled.', 'Firewall Policy → edit LAN-to-Azure → Status: Enable (CLI: config firewall policy → edit <id> → set status enable).'],
      fix: st => { pol(st, 'LAN-to-Azure').status = 'enable'; },
      why: 'Disabled rules are invisible in traffic but easy to miss in a long list. Policy Lookup finds them in seconds.' },
    { id: 'p1-off', level: 1, side: 'FortiGate', slot: 'p1state', title: 'IPsec tunnel administratively disabled',
      inject: (st, lvl) => { p1(st).status = 'disable'; fgLog(st, lvl, 'vpn.ipsec.phase1-interface To-Azure status'); return {}; },
      ticket: () => 'The Azure tunnel is down. Nobody changed anything, they say.',
      hints: () => ['VPN → IPsec Tunnels: read the reason column.', 'Administratively disabled means someone turned it off on purpose.', 'Edit To-Azure and set its status to enabled.'],
      steps: () => ['VPN → IPsec Tunnels: To-Azure says "Tunnel is administratively disabled".', 'Edit To-Azure → Status: enable (CLI: config vpn ipsec phase1-interface → edit To-Azure → set status enable).'],
      fix: st => { p1(st).status = 'enable'; },
      why: '"Nobody changed anything" is rarely true. The event log is your friend.' },
    { id: 'lng-ip', ref: 'FGAZ-002', level: 2, side: 'Azure', slot: 'lng-ip', title: 'Local network gateway points at the wrong office IP',
      inject: (st, lvl) => { const l = lng(st), bad = pick(['203.0.113.11', '203.0.113.12', '203.0.113.14', '198.51.100.10']); l.ip = bad; azLog(st, lvl, 'Create or update local network gateway', l.name); return { bad }; },
      ticket: () => 'Someone on the Azure team "updated the office details" and now the tunnel will not come back.',
      hints: () => ['The FortiGate reports no response from Azure at all. Azure is ignoring the firewall.', 'Azure only accepts IKE from the address on the local network gateway.', 'Compare lng-talvex-office\'s IP address with the FortiGate WAN IP (port1).'],
      steps: p => ['FortiGate: To-Azure says Azure only accepts IKE from the local network gateway address.', `Azure: Site-to-site VPN → Local network gateway shows ${p.bad}. The office WAN IP is 203.0.113.10.`, 'Edit lng-talvex-office → IP address 203.0.113.10 → Save.'],
      fix: st => { lng(st).ip = '203.0.113.10'; },
      why: 'Azure silently drops IKE from unknown peers, so the firewall just sees timeouts. Always check the local network gateway first.' },
    { id: 'ike-ver', ref: 'FGAZ-021', level: 2, side: 'Azure', slot: 'ike', title: 'Azure connection switched to IKEv1',
      inject: (st, lvl) => { cn(st).ike = 'IKEv1'; azLog(st, lvl, 'Create or update connection', 'cn-talvex-office'); return {}; },
      ticket: () => 'The tunnel dropped right after an Azure change ticket titled "compatibility settings".',
      hints: () => ['Read the To-Azure reason on the FortiGate.', 'Both sides must speak the same IKE version.', 'Azure connection cn-talvex-office → Configuration → IKE protocol.'],
      steps: () => ['FortiGate: To-Azure says the Azure connection is set to IKEv1 but the tunnel speaks IKEv2.', 'Azure: Connection → Configuration → IKE protocol: IKEv2 → Save.'],
      fix: st => { cn(st).ike = 'IKEv2'; },
      why: 'IKEv2 is the modern standard and what Azure route-based gateways expect. Downgrading to IKEv1 breaks the tunnel and weakens it.' },
    { id: 'pfs', ref: 'FGAZ-004', level: 2, side: 'FortiGate', slot: 'p2', title: 'PFS turned on in phase 2 (Azure default policy uses none)',
      inject: (st, lvl) => { const q = p2(st), g = pick([14, 19, 20]); q.pfs = 'enable'; q.dhgrp = [g]; fgLog(st, lvl, 'vpn.ipsec.phase2-interface To-Azure-P2'); return { g }; },
      ticket: () => 'An overnight "hardening" script ran against the firewall. Azure has been down since.',
      hints: () => ['Phase 1 is up, so the keys and IKE are fine. Look at phase 2.', 'The Azure default IPsec policy uses PFS None.', 'VPN → IPsec Tunnels → edit To-Azure → phase 2 → PFS.'],
      steps: p => ['FortiGate: To-Azure phase 2 fails: the peer rejected the PFS Diffie-Hellman group.', `Phase 2 To-Azure-P2 now has PFS on with group ${p.g}. Azure's default policy has no PFS.`, 'CLI: config vpn ipsec phase2-interface → edit To-Azure-P2 → set pfs disable → next → end. (Or apply a matching custom IPsec policy on Azure.)'],
      fix: st => { const q = p2(st); q.pfs = 'disable'; q.dhgrp = []; },
      why: 'Hardening one side of a tunnel without the other side breaks it. Crypto changes are always a two-team change.' },
    { id: 'dh', ref: 'FGAZ-003', level: 2, side: 'FortiGate', slot: 'p1crypto', title: 'Phase 1 DH group changed to one Azure does not accept',
      inject: (st, lvl) => { const g = pick([5, 15, 19, 20, 21]); p1(st).dhgrp = [g]; fgLog(st, lvl, 'vpn.ipsec.phase1-interface To-Azure dhgrp'); return { g }; },
      ticket: () => 'After last night\'s "crypto upgrade" on the firewall, the Azure tunnel never came back.',
      hints: () => ['The FortiGate reason mentions INVALID_KE_PAYLOAD.', 'That is a Diffie-Hellman group mismatch in phase 1.', 'Azure\'s default policy accepts DH groups 2, 14 and 24.'],
      steps: p => [`FortiGate: To-Azure fails with INVALID_KE_PAYLOAD: phase 1 offers DH group ${p.g}.`, 'Set phase 1 back to DH group 14: config vpn ipsec phase1-interface → edit To-Azure → set dhgrp 14.'],
      fix: st => { p1(st).dhgrp = [14]; },
      why: 'A "stronger" setting is useless if the peer does not support it. Check the peer\'s supported list before changing crypto.' },
    { id: 'nat-t', level: 2, side: 'FortiGate', slot: 'p1nat', title: 'NAT traversal disabled on the tunnel',
      inject: (st, lvl) => { p1(st).nattraversal = 'disable'; fgLog(st, lvl, 'vpn.ipsec.phase1-interface To-Azure nattraversal'); return {}; },
      ticket: () => 'The tunnel negotiates but nothing gets through. Someone was "optimizing" the VPN settings.',
      hints: () => ['IKE_AUTH completes, so the keys are fine. Read the rest of the reason.', 'The Azure gateway sits behind NAT and expects NAT-T on UDP 4500.', 'Phase 1 → NAT traversal.'],
      steps: () => ['FortiGate: To-Azure says ESP is being dropped and Azure expects NAT-T.', 'config vpn ipsec phase1-interface → edit To-Azure → set nattraversal enable.'],
      fix: st => { p1(st).nattraversal = 'enable'; },
      why: 'Most cloud gateways are behind NAT. Without NAT-T the tunnel looks up but carries nothing.' },
    { id: 'shadow', ref: 'FGAZ-018', level: 2, side: 'FortiGate', slot: 'pol-lan', title: 'A deny rule above LAN-to-Azure shadows it',
      inject: (st, lvl) => {
        const name = pick(['Block-Old-Subnet', 'Temp-Deny-Azure', 'Quarantine-Rule']), id = st.nextPolicyId++;
        st.policies.unshift(Object.assign(SIM.clone(pol(st, 'LAN-to-Azure')), { id, name, service: ['ALL'], action: 'deny', nat: false, hits: 0, lastHit: 0, comments: pick(['temporary', 'incident 4471', '']) }));
        fgLog(st, lvl, 'firewall.policy ' + name); return { name, id };
      },
      ticket: () => 'Since yesterday\'s security change, nobody can reach the Azure app server, even though the tunnel is up.',
      hints: () => ['Policy Lookup 10.10.10.20 → 10.100.1.4 HTTPS shows exactly which rule matches.', 'Rules are checked top down. The first match wins.', 'A new deny rule sits above LAN-to-Azure.'],
      steps: p => [`Policy Lookup shows policy ${p.id} "${p.name}" matching first with action DENY.`, `Firewall Policy: delete or disable "${p.name}" (or move it below LAN-to-Azure if it is still needed).`],
      fix: st => { st.policies = st.policies.filter(x => x.name !== 'Block-Old-Subnet' && x.name !== 'Temp-Deny-Azure' && x.name !== 'Quarantine-Rule'); },
      why: 'Rule order is everything. A broad deny placed at the top silently overrides every specific allow below it.' },
    { id: 'nat-on', level: 2, side: 'FortiGate', slot: 'pol-lan-nat', title: 'NAT enabled on the LAN-to-Azure policy',
      inject: (st, lvl) => { pol(st, 'LAN-to-Azure').nat = true; fgLog(st, lvl, 'firewall.policy LAN-to-Azure nat'); return {}; },
      ticket: () => 'The Azure app works for some people, but its logs show every request coming from one address and the auditors are asking why.',
      hints: () => ['Run Policy Lookup 10.10.10.20 → 10.100.1.4 and read the source NAT step.', 'NAT on a site-to-site policy hides the real office addresses from Azure.', 'LAN-to-Azure → NAT.'],
      steps: () => ['Policy Lookup: the Source NAT step says NAT is ON for a VPN tunnel.', 'Firewall Policy → LAN-to-Azure → NAT off (CLI: set nat disable).'],
      fix: st => { pol(st, 'LAN-to-Azure').nat = false; },
      why: 'Site-to-site traffic should keep its real source addresses, both for return routing and for audit trails (a CMMC requirement).' },
    { id: 'svc', level: 2, side: 'FortiGate', slot: 'pol-lan-svc', title: 'HTTPS removed from the LAN-to-Azure services',
      inject: (st, lvl) => { const p = pol(st, 'LAN-to-Azure'); p.service = p.service.filter(s => s !== 'HTTPS'); fgLog(st, lvl, 'firewall.policy LAN-to-Azure service'); return {}; },
      ticket: () => 'Remote desktop to the Azure server works fine, but the web app will not load.',
      hints: () => ['Only one service is broken, so the tunnel and routing are fine.', 'Policy Lookup on TCP/443 versus TCP/3389.', 'Check the service list on LAN-to-Azure.'],
      steps: () => ['Policy Lookup on TCP/443 says HTTPS is not in the LAN-to-Azure service list.', 'Firewall Policy → LAN-to-Azure → Services: add HTTPS (CLI: set service "HTTPS" "RDP" "SMB").'],
      fix: st => { const p = pol(st, 'LAN-to-Azure'); if (!p.service.includes('HTTPS')) p.service.unshift('HTTPS'); },
      why: 'Partial outages point at policy, not the tunnel. Comparing a working service with a broken one narrows it down fast.' },
    { id: 'smb-in', level: 2, side: 'FortiGate', slot: 'pol-in', title: 'Azure-to-FS01 inbound policy disabled',
      inject: (st, lvl) => { pol(st, 'Azure-to-FS01').status = 'disable'; fgLog(st, lvl, 'firewall.policy Azure-to-FS01'); return {}; },
      ticket: () => 'The app in Azure suddenly cannot save files to the office file server (FS01).',
      hints: () => ['This is traffic coming in from Azure, so look at the inbound direction.', 'Policy Lookup with incoming interface To-Azure, 10.100.1.4 → 10.10.10.50, TCP/445.', 'Check the status of Azure-to-FS01.'],
      steps: () => ['Policy Lookup To-Azure → 10.10.10.50 TCP/445 falls to the implicit deny: Azure-to-FS01 is disabled.', 'Firewall Policy → Azure-to-FS01 → Status: Enable.'],
      fix: st => { pol(st, 'Azure-to-FS01').status = 'enable'; },
      why: 'Every tunnel needs a rule in each direction. Replies are automatic, but new connections from Azure need their own allow rule.' },
    { id: 'addr', level: 3, side: 'FortiGate', slot: 'addr', title: 'Azure-Hub address object was "corrected" to the wrong range',
      inject: (st, lvl) => { const a = SIM.addrObj(st, 'Azure-Hub'), v = pick([['10.110.0.0', 16], ['10.100.0.0', 24], ['10.10.0.0', 16]]); a.ip = v[0]; a.bits = v[1]; fgLog(st, lvl, 'firewall.address Azure-Hub'); return { bad: v[0] + '/' + v[1] }; },
      ticket: () => 'Ever since someone tidied the address objects, the Azure app server is unreachable. The tunnel is up.',
      hints: () => ['Policy Lookup: why does LAN-to-Azure no longer match?', 'The destination is checked against the policy\'s address objects.', 'Look at what Azure-Hub actually contains.'],
      steps: p => [`Policy Lookup: destination 10.100.1.4 is not in Azure-Hub, which is now ${p.bad}.`, 'Policy & Objects → Addresses → Azure-Hub → subnet 10.100.0.0/16 (CLI: set subnet 10.100.0.0 255.255.0.0).'],
      fix: st => { const a = SIM.addrObj(st, 'Azure-Hub'); a.ip = '10.100.0.0'; a.bits = 16; },
      why: 'Address objects are shared by many rules. One typo can break every rule that uses it, so name and document them carefully.' },
    { id: 'bgp-as', level: 3, side: 'FortiGate', slot: 'bgp-fg', title: 'Wrong remote AS on the FortiGate BGP neighbor',
      inject: (st, lvl) => { const n = st.bgp.neighbors[0], bad = pick([65516, 65155, 65551, 65015]); n.remoteAs = bad; fgLog(st, lvl, 'router.bgp neighbor 10.100.0.254'); return { bad }; },
      ticket: () => 'The tunnel is up, but after a routing change the firewall no longer has a route to Azure.',
      hints: () => ['Tunnel up, no route: think BGP. Check Network → BGP.', 'OPEN rejected means the AS numbers do not match.', 'The Azure gateway is AS 65515.'],
      steps: p => [`BGP to 10.100.0.254 is down: OPEN rejected, peer AS is 65515 but ${p.bad} is configured.`, 'config router bgp → config neighbor → edit 10.100.0.254 → set remote-as 65515.'],
      fix: st => { st.bgp.neighbors[0].remoteAs = 65515; },
      why: 'With BGP, routes depend on the session. A down session means the routes vanish, even though the tunnel is fine.' },
    { id: 'lng-asn', level: 3, side: 'Azure', slot: 'bgp-az', title: 'Local network gateway ASN does not match the office firewall',
      inject: (st, lvl) => { const l = lng(st), bad = pick([65011, 65100, 65001, 65020]); l.asn = bad; azLog(st, lvl, 'Create or update local network gateway', l.name); return { bad }; },
      ticket: () => 'BGP to Azure went down right after the Azure team updated the office settings in the portal.',
      hints: () => ['Check the BGP reason on the FortiGate side.', 'Azure checks the office AS against the local network gateway.', 'The firewall is AS 65010.'],
      steps: p => [`FortiGate BGP: OPEN rejected by Azure, local network gateway says AS ${p.bad} but the firewall is AS 65010.`, 'Azure: Site-to-site VPN → Local network gateway → Configuration → ASN 65010 → Save.'],
      fix: st => { lng(st).asn = 65010; },
      why: 'BGP identity is configured twice in Azure (gateway and local network gateway). Both must match the real routers.' },
    { id: 'cn-bgp', level: 3, side: 'Azure', slot: 'bgp-az', title: 'BGP disabled on the Azure connection',
      inject: (st, lvl) => { cn(st).enableBgp = false; azLog(st, lvl, 'Create or update connection', 'cn-talvex-office'); return {}; },
      ticket: () => 'After an Azure maintenance window, the office lost its route to Azure. The tunnel itself is up.',
      hints: () => ['Tunnel up, no routes: BGP.', 'Read the BGP reason on the FortiGate.', 'BGP must be on for both the gateway and the connection.'],
      steps: () => ['FortiGate BGP: BGP is off on the Azure side (connection cn-talvex-office: off).', 'Azure: Connection → Configuration → Enable BGP → Save.'],
      fix: st => { cn(st).enableBgp = true; },
      why: 'A setting changed on the cloud side can take down routing on-prem. That is why both teams need to see both sides.' },
    { id: 'return', level: 4, side: 'Both', slot: 'return', title: 'Azure lost its route back to the office',
      inject: (st, lvl) => { st.bgp.networks = []; const l = lng(st), bad = pick(['10.10.1.0/24', '10.1.10.0/24', '10.10.100.0/24']); const pp = AZ.parsePrefix(bad); l.addressSpace = [pp]; fgLog(st, lvl, 'router.bgp network'); azLog(st, lvl, 'Create or update local network gateway', l.name); return { bad }; },
      ticket: () => 'Requests to the Azure app time out. The tunnel is up and BGP is established. Nobody can explain it.',
      hints: () => ['Policy Lookup reaches Azure. Read what happens after that.', 'Azure needs a route back to 10.10.10.0/24: either from BGP or from the local network gateway.', 'Neither the BGP network list nor the local network gateway address space covers the LAN any more.'],
      steps: p => ['Policy Lookup: Azure has no route back to 10.10.10.20.', `The FortiGate no longer advertises 10.10.10.0/24 over BGP, and lng-talvex-office lists ${p.bad} instead of 10.10.10.0/24.`, 'Fix either one (best: both): config router bgp → config network → edit 1 → set prefix 10.10.10.0 255.255.255.0, and set the local network gateway address space to 10.10.10.0/24.'],
      fix: st => { st.bgp.networks = [{ id: 1, prefix: '10.10.10.0', bits: 24 }]; lng(st).addressSpace = [{ ip: '10.10.10.0', bits: 24 }]; },
      why: 'Routing is two-way. A tunnel can be perfectly up while the far side has no idea how to send the reply.' },
    { id: 'az-custom', ref: 'FGAZ-003', level: 4, side: 'Both', slot: 'p2', title: 'Azure applied a custom IPsec policy the FortiGate does not match',
      inject: (st, lvl) => { st.azure.policy = 'custom'; azLog(st, lvl, 'Create or update connection', 'cn-talvex-office'); return {}; },
      ticket: () => 'The Azure team "tightened the crypto policy for compliance". The tunnel has been down ever since.',
      hints: () => ['Phase 1 comes up. Phase 2 does not. Read the phase 2 reason.', 'The custom Azure policy wants AES256-GCM with PFS group 14 in phase 2.', 'Either match it on the FortiGate phase 2, or (if the change was not approved) set the connection back to the default policy.'],
      steps: () => ['FortiGate: phase 2 NO_PROPOSAL_CHOSEN: the custom Azure policy requires AES256GCM with PFS group 14.', 'Option A (keep the stronger policy): config vpn ipsec phase2-interface → edit To-Azure-P2 → set proposal aes256gcm → set pfs enable → set dhgrp 14.', 'Option B (roll back the unapproved change): Azure → Connection → Configuration → IPsec / IKE policy: Default.'],
      fix: st => { st.azure.policy = 'default'; },
      why: 'Compliance-driven crypto changes are good, but they must be coordinated: one side changing alone is an outage.' },
    /* ---- from the FortiGate + Azure field scenario pack (FGAZ ids): each one is a documented real-world failure ---- */
    { id: 'dpd-off', ref: 'FGAZ-008', level: 2, side: 'FortiGate', slot: 'dpd', title: 'Dead Peer Detection disabled, then Azure did gateway maintenance',
      inject: (st, lvl) => { p1(st).dpd = 'disable'; const g = st.azure.gateways[0]; g.staleSa = true; fgLog(st, lvl, 'vpn.ipsec.phase1-interface To-Azure dpd'); if (lvl < 5) AZ.log(st, 'Planned maintenance: VPN gateway instances updated', g.name, 'rg-talvex-hub-scus', 'Succeeded', 'Azure platform'); return {}; },
      ticket: () => 'Azure did planned maintenance on the VPN gateway overnight. Everything was supposed to come back by itself. It did not.',
      hints: () => ['Azure says the connection is down. What does the FortiGate think the tunnel is doing? Read the To-Azure reason.', 'The FortiGate still trusts an IPsec SA that Azure threw away during maintenance. Which feature notices a dead peer?', 'Phase 1 of To-Azure: Dead Peer Detection is disabled.'],
      steps: () => ['FortiGate: VPN → IPsec Tunnels: To-Azure is stuck on a stale SA. Azure rebuilt its side during maintenance and the FortiGate never noticed, because DPD is off.', 'Edit To-Azure → Dead Peer Detection: On Idle (CLI: config vpn ipsec phase1-interface → edit To-Azure → set dpd on-idle → next → end). DPD finds the dead SA and the tunnel renegotiates.', 'Real world: keep the FortiGate DPD timers (dpd-retrycount, dpd-retryinterval) in line with the Azure connection DPD timeout, which Set-AzVirtualNetworkGatewayConnection -DpdTimeoutInSeconds changes.'],
      fix: st => { p1(st).dpd = 'on-idle'; },
      why: 'Without DPD, a tunnel that died on the far side looks up forever on yours. Azure patches its gateways, so assume the peer will restart and let DPD notice.' },
    { id: 'ts-sel', ref: 'FGAZ-005', level: 3, side: 'FortiGate', slot: 'p2', title: 'Phase 2 narrowed to specific subnets (traffic selector mismatch)',
      inject: (st, lvl) => { const q = p2(st), v = pick([['10.10.10.0', 24, '10.100.1.0', 24], ['10.10.10.0', 24, '10.100.0.0', 16], ['10.10.0.0', 16, '10.100.1.0', 24]]); q.srcIp = v[0]; q.srcBits = v[1]; q.dstIp = v[2]; q.dstBits = v[3]; fgLog(st, lvl, 'vpn.ipsec.phase2-interface To-Azure-P2 src-subnet dst-subnet'); return { src: v[0] + '/' + v[1], dst: v[2] + '/' + v[3] }; },
      ticket: () => 'The firewall team "tightened the VPN so only the office LAN can reach the app subnet". The tunnel has been down ever since.',
      hints: () => ['Phase 1 comes up. Which phase fails, and with which error?', 'TS_UNACCEPTABLE is about traffic selectors: the networks each side proposes in phase 2.', 'A route-based Azure gateway proposes 0.0.0.0/0 to 0.0.0.0/0. Look at the source and destination on To-Azure-P2.'],
      steps: p => ['FortiGate: VPN → IPsec Tunnels: To-Azure phase 2 fails with TS_UNACCEPTABLE.', `Phase 2 To-Azure-P2 now proposes ${p.src} → ${p.dst}. A route-based Azure gateway proposes any-to-any.`, 'CLI: config vpn ipsec phase2-interface → edit To-Azure-P2 → set src-subnet 0.0.0.0 0.0.0.0 → set dst-subnet 0.0.0.0 0.0.0.0 → next → end. Restrict traffic with firewall policies instead.', 'Real FortiGate (7.4.1 and later): diagnose vpn ike log filter rem-addr4 198.51.100.25, then diagnose debug application ike -1 and diagnose debug enable to see both sides\' selectors. Before 7.4.1 the filter was diagnose vpn ike log-filter dst-addr4.'],
      fix: st => { const q = p2(st); q.srcIp = '0.0.0.0'; q.srcBits = 0; q.dstIp = '0.0.0.0'; q.dstBits = 0; },
      why: 'Route-based Azure gateways negotiate one any-to-any selector pair and leave the rest to routing. Specific selectors need UsePolicyBasedTrafficSelectors on the Azure connection and a phase 2 for every subnet pair.' },
    { id: 'p2-extra', ref: 'FGAZ-017', level: 3, side: 'FortiGate', slot: 'p2', title: 'Firmware upgrade left an extra phase 2 that does not match Azure',
      inject: (st, lvl) => { const name = pick(['To-Azure-P2-1', 'To-Azure_0', 'To-Azure-P2-old']); st.vpn.phase2.push({ name, phase1: 'To-Azure', proposals: ['aes256-sha1'], pfs: 'enable', dhgrp: [14], srcIp: '0.0.0.0', srcBits: 0, dstIp: '0.0.0.0', dstBits: 0 }); if (lvl < 5) SIM.event(st, 'system', 'notice', 'Firmware upgraded to v7.4.5 build 2702 by admin via GUI(10.10.10.41): configuration converted'); return { name }; },
      ticket: () => 'The firewall was upgraded in last night\'s maintenance window. The Azure tunnel has been down since. The change record says "no config changes".',
      hints: () => ['Phase 1 is up. Which phase 2 is failing? Read its name carefully.', 'Count the phase 2 objects under To-Azure (show vpn ipsec phase2-interface).', 'One of them was not there before the upgrade, and its proposal (PFS group 14) does not match Azure\'s default policy.'],
      steps: p => [`FortiGate: To-Azure phase 2 "${p.name}" fails: the peer rejected its PFS group.`, `show vpn ipsec phase2-interface lists two phase 2 objects on To-Azure: To-Azure-P2 (correct) and ${p.name} (aes256-sha1 with PFS group 14, new since the upgrade).`, `CLI: config vpn ipsec phase2-interface → delete ${p.name} → end.`],
      fix: (st, p) => { st.vpn.phase2 = st.vpn.phase2.filter(q => q.name !== p.name); },
      why: 'After every firmware upgrade, diff the config against the pre-upgrade backup. Upgrades can convert or add objects, and "no config changes" only means nobody typed any.' },
    { id: 'bgp-path', ref: 'FGAZ-010', level: 3, side: 'FortiGate', slot: 'bgp-fg', title: 'BGP peer unreachable inside the tunnel',
      inject: (st, lvl) => {
        if (Math.random() < 0.5) { const i = st.routes.findIndex(r => r.dst === '10.100.0.254' && r.bits === 32); if (i < 0) throw new Error('no peer route'); const route = SIM.clone(st.routes.splice(i, 1)[0]); fgLog(st, lvl, 'router.static ' + route.seq); return { kind: 'route', route }; }
        const t = p1(st); t.tunIp = ''; t.tunRemote = ''; fgLog(st, lvl, 'system.interface To-Azure ip'); return { kind: 'tunip' };
      },
      ticket: p => p.kind === 'route' ? 'Someone "cleaned up unused static routes" on the firewall. Azure still shows the connection as Connected, but the office has no routes to Azure.' : 'Someone "cleaned up unused interface addresses" on the firewall. Azure still shows the connection as Connected, but the office has no routes to Azure.',
      hints: p => ['Tunnel up, no routes: BGP. What state is the neighbor in, and why?', 'BGP runs inside the tunnel. Can the firewall even reach 10.100.0.254 through To-Azure?', p.kind === 'route' ? 'Routing Monitor (get router info routing-table all): is there still a /32 route for 10.100.0.254 via To-Azure?' : 'Network → Interfaces → To-Azure: does the tunnel interface still have 169.254.21.2 with remote 169.254.21.1?'],
      steps: p => p.kind === 'route'
        ? ['Network → BGP: neighbor 10.100.0.254 says there is no route to it through the IPsec tunnel.', 'The /32 static route for the Azure BGP peer via To-Azure was deleted.', 'CLI: config router static → edit 0 → set dst 10.100.0.254 255.255.255.255 → set device "To-Azure" → next → end.']
        : ['Network → BGP: neighbor 10.100.0.254 says tunnel interface To-Azure has no IP.', 'Network → Interfaces → To-Azure: IP and remote IP are blank.', 'CLI: config system interface → edit To-Azure → set ip 169.254.21.2 255.255.255.255 → set remote-ip 169.254.21.1 255.255.255.255 → next → end.'],
      fix: (st, p) => { if (p.kind === 'route') { if (!st.routes.some(r => r.dst === '10.100.0.254' && r.bits === 32)) st.routes.push(SIM.clone(p.route)); } else { const t = p1(st); t.tunIp = '169.254.21.2'; t.tunRemote = '169.254.21.1'; } },
      why: 'BGP over IPsec needs three things inside the tunnel: addresses on the tunnel interface, a route to the peer through the tunnel, and matching neighbor settings. Lose one and the routes vanish while the tunnel still looks healthy.' },
    { id: 'asn-rsvd', ref: 'FGAZ-012', level: 3, side: 'FortiGate', slot: 'bgp-fg', title: 'Firewall BGP AS changed to an Azure-reserved number',
      inject: (st, lvl) => { const bad = pick([65515, 65517, 65518, 65519, 65520]); st.bgp.as = bad; fgLog(st, lvl, 'router.bgp as'); return { bad }; },
      ticket: () => 'The network team renumbered the firewall\'s BGP AS "to match the Azure standard". The office lost its Azure routes right after.',
      hints: () => ['Tunnel up, BGP down. Compare the AS number each side claims.', 'Azure reserves some private AS numbers for itself: 65515 and 65517 to 65520 (and public 8074, 8075 and 12076).', 'The office firewall must keep a non-reserved private AS that matches the local network gateway: 65010.'],
      steps: p => [`Network → BGP: local AS is now ${p.bad}. Azure reserves it, and lng-talvex-office still says the office is AS 65010.`, 'CLI: config router bgp → set as 65010 → end.', 'Real world, check both sides: get router info bgp summary on the FortiGate, and (Get-AzLocalNetworkGateway -Name lng-talvex-office -ResourceGroupName rg-talvex-hub-scus).BgpSettings in Azure PowerShell.'],
      fix: st => { st.bgp.as = 65010; },
      why: 'Azure keeps 65515 and 65517-65520 for its own gateways and route servers. The on-premises side needs its own private AS, and the same number on the local network gateway.' },
    { id: 'bgp-passive', ref: 'FGAZ-011', level: 4, side: 'FortiGate', slot: 'bgp-fg', title: 'BGP neighbor set to passive while the office peers from an APIPA address',
      inject: (st, lvl) => { st.bgp.neighbors[0].passive = 'enable'; fgLog(st, lvl, 'router.bgp neighbor 10.100.0.254 passive'); return {}; },
      ticket: () => 'A consultant "hardened BGP so the firewall only accepts sessions and never opens them". Routes to Azure vanished after the next tunnel reset.',
      hints: () => ['Tunnel up, BGP not Established. Read the neighbor reason.', 'The office BGP address is 169.254.21.2, an APIPA address. Who does Microsoft say has to open the session in that case?', 'Azure never initiates to an APIPA peer, so the FortiGate must. Look for passive on the neighbor.'],
      steps: () => ['Network → BGP: neighbor 10.100.0.254 sits in Active. It is passive, and Azure does not open BGP to an APIPA (169.254.x.x) peer, so neither side starts the session.', 'Edit the neighbor → Passive: Disable (CLI: config router bgp → config neighbor → edit 10.100.0.254 → set passive disable → next → end).', 'Real world, Azure side: Get-AzVirtualNetworkGatewayBgpPeerStatus -ResourceGroupName rg-talvex-hub-scus -VirtualNetworkGatewayName vgw-talvex-hub shows the peer state.'],
      fix: st => { st.bgp.neighbors[0].passive = 'disable'; },
      why: 'Microsoft documents that Azure VPN Gateway does not initiate BGP to APIPA peers. When the office uses APIPA, the office router has to be the active speaker.' },
    { id: 'overlap', ref: 'FGAZ-020', level: 4, side: 'Azure', slot: 'vnet', title: 'Azure VNet address space now overlaps the office LAN',
      inject: (st, lvl) => { const v = AZ.vnet(st, 'rg-talvex-hub-scus', 'vnet-talvex-hub'), bad = pick(['10.10.0.0/16', '10.10.10.0/24', '10.0.0.0/12']); v.addressSpace.push(AZ.parsePrefix(bad)); azLog(st, lvl, 'Create or update virtual network', v.name); return { bad }; },
      ticket: () => 'The Azure team expanded the hub network to get ready for the file server migration. Since then the office cannot reach the app server, although the tunnel and BGP are both up.',
      hints: () => ['Policy Lookup 10.10.10.20 → 10.100.1.4 gets into Azure. Read the Azure step.', 'Compare every address space on vnet-talvex-hub with the office LAN, 10.10.10.0/24.', 'A new address space contains the office LAN, so Azure thinks the office is local.'],
      steps: p => ['Policy Lookup 10.10.10.20 → 10.100.1.4: the Azure step says the reply stays inside the VNet.', `Azure: Networking → Virtual networks → vnet-talvex-hub → Address space: ${p.bad} overlaps the office LAN 10.10.10.0/24.`, `Remove ${p.bad} from the address space (it has no subnets yet). In Azure PowerShell: $vnet = Get-AzVirtualNetwork -Name vnet-talvex-hub -ResourceGroupName rg-talvex-hub-scus; $vnet.AddressSpace.AddressPrefixes.Remove('${p.bad}'); $vnet | Set-AzVirtualNetwork.`, 'If both sides truly need the same range, renumber one side or translate it with Azure VPN Gateway NAT rules (IngressSnat / EgressSnat).'],
      fix: (st, p) => { const v = AZ.vnet(st, 'rg-talvex-hub-scus', 'vnet-talvex-hub'), b = AZ.parsePrefix(p.bad); v.addressSpace = v.addressSpace.filter(a => !(a.ip === b.ip && a.bits === b.bits)); },
      why: 'Overlapping address space is a design bug, not a typo. Reserve and document cloud IP ranges before anyone builds them, and check new ranges against every connected site.' }
  ];

  /* real-world provenance for faults tagged with ref: the pack's own evidence note and source links, shown after an incident */
  NM.SOURCES = {
    "FGAZ-001": { title: "Pre-shared key mismatch", evidence: "Official Microsoft troubleshooting guide lists PSK mismatch as a leading cause; AUTHENTICATION_FAILED log text also seen in community blog.", urls: ["https://learn.microsoft.com/en-us/troubleshoot/azure/vpn-gateway/troubleshoot-vpn-tunnel-cannot-connect"] },
    "FGAZ-002": { title: "Wrong on-premises public IP in the Azure Local Network Gateway", evidence: "Official Microsoft guide lists wrong on-premises peer public IP on the LNG as a top cause.", urls: ["https://learn.microsoft.com/en-us/troubleshoot/azure/vpn-gateway/troubleshoot-vpn-tunnel-cannot-connect"] },
    "FGAZ-003": { title: "IKE/IPsec proposal mismatch (Azure custom policy vs FortiGate proposals)", evidence: "Microsoft docs plus a real Server Fault post and Fortinet doc.", urls: ["https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto", "https://serverfault.com/questions/1048360/azure-site-to-site-vpn-and-fortigate-ipsec-phase-2-error-on-sa-re-establishment", "https://docs.fortinet.com/document/fortigate/8.0.2/administration-guide/255100/ipsec-vpn-to-azure-with-virtual-network-gateway"] },
    "FGAZ-004": { title: "PFS enabled on only one side (tunnel flaps or fails at phase 2)", evidence: "Fortinet KB and Microsoft guide both name PFS mismatch.", urls: ["https://community.fortinet.com/fortigate-3/troubleshooting-tip-some-known-ipsec-vpn-issues-between-fortigate-and-third-party-devices-153830", "https://learn.microsoft.com/en-us/troubleshoot/azure/vpn-gateway/troubleshoot-vpn-tunnel-cannot-connect"] },
    "FGAZ-005": { title: "Phase 2 traffic selector mismatch (specific subnets vs route-based gateway)", evidence: "Real Microsoft Q&A thread plus how-to blog and Microsoft doc.", urls: ["https://learn.microsoft.com/en-us/answers/questions/1289556/azure-to-fortigate-vpn-phase-2-traffic-selector-mi", "https://www.dharper.co.uk/knowledge-base/site-to-site-vpn-between-a-fortigate-and-an-azure-vpn-gateway-route-based-ikev2", "https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto"] },
    "FGAZ-008": { title: "Dead Peer Detection disabled or too aggressive", evidence: "Fortinet KB, Microsoft Q&A and Microsoft doc.", urls: ["https://community.fortinet.com/fortigate-3/technical-tip-explanation-of-ipsec-vpn-dpd-options-and-on-idle-tunnel-flushing-process-137398", "https://learn.microsoft.com/en-us/answers/questions/2213265/s2s-vpn-connection-custom-ipsec-policy-with-client", "https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto"] },
    "FGAZ-010": { title: "BGP stays Idle over the tunnel: missing BGP peer addresses/selectors", evidence: "Fortinet KBs, a real forum thread, and Microsoft BGP troubleshooting guide.", urls: ["https://community.fortinet.com/fortigate-3/technical-tip-bgp-over-an-azure-vnet-vpn-103398", "https://community.fortinet.com/fortigate-3/troubleshooting-tip-bgp-peering-is-not-established-after-setting-up-site-to-site-vpn-tunnel-between-azure-firewall-and-on-premise-fortigate-155143", "https://community.fortinet.com/support-forum-92/fortigate-azure-ipsec-to-a-vpn-gateway-using-bgp-46337", "https://learn.microsoft.com/en-us/troubleshoot/azure/vpn-gateway/vpn-gateway-troubleshoot-bgp"] },
    "FGAZ-011": { title: "APIPA BGP: Azure never initiates the session", evidence: "Microsoft docs.", urls: ["https://learn.microsoft.com/en-us/azure/vpn-gateway/configure-bgp", "https://learn.microsoft.com/en-us/troubleshoot/azure/vpn-gateway/vpn-gateway-troubleshoot-bgp"] },
    "FGAZ-012": { title: "BGP ASN conflict or reserved ASN", evidence: "Microsoft BGP troubleshooting guide.", urls: ["https://learn.microsoft.com/en-us/troubleshoot/azure/vpn-gateway/vpn-gateway-troubleshoot-bgp"] },
    "FGAZ-017": { title: "FortiOS upgrade adds an extra phase 2 object so phase 2 no longer matches", evidence: "Fortinet community KB (FortiGate-to-FortiGate example, applicable to Azure).", urls: ["https://community.fortinet.com/fortigate-3/troubleshooting-tip-ipsec-phase2-failed-to-come-up-after-fortios-fortigate-upgrade-180400"] },
    "FGAZ-018": { title: "Tunnel up, no traffic: missing firewall policy or RPF/route problem on the FortiGate", evidence: "Fortinet KB (RPF article read in full; the second link appeared in search results only).", urls: ["https://community.fortinet.com/fortigate-3/troubleshooting-tip-troubleshooting-ipsec-vpn-routing-issues-related-to-reverse-path-forwarding-rpf-145849", "https://community.fortinet.com/fortigate-3/troubleshooting-tip-ipsec-tunnel-up-but-no-traffic-is-passing-though-the-tunnel-111265"] },
    "FGAZ-020": { title: "Overlapping address space between on-prem and Azure VNet", evidence: "Microsoft Q&A advice and Microsoft NAT doc.", urls: ["https://learn.microsoft.com/en-us/answers/questions/1289556/azure-to-fortigate-vpn-phase-2-traffic-selector-mi", "https://learn.microsoft.com/en-us/azure/vpn-gateway/nat-overview"] },
    "FGAZ-021": { title: "BGP requested on a Basic SKU or policy-based VPN gateway; IKEv1/IKEv2 mismatch", evidence: "Microsoft docs.", urls: ["https://learn.microsoft.com/en-us/troubleshoot/azure/vpn-gateway/vpn-gateway-troubleshoot-bgp", "https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings"] }
  };

  /* ---------- incidents ---------- */
  NM.faultsFor = level => {
    const cap = Math.min(level, 4), count = level <= 3 ? 1 : level <= 6 ? 2 : 3;
    const pool = NM.FAULTS.filter(f => f.level <= cap), chosen = [];
    const free = () => pool.filter(f => !chosen.some(c => c.slot === f.slot || c.id === f.id));
    const top = pool.filter(f => f.level === cap);
    chosen.push(top.length && Math.random() < 0.5 ? pick(top) : pick(pool));   // the lead fault leans toward the current tier
    while (chosen.length < count) {
      const cand = free(); if (!cand.length) break;
      const sides = new Set(chosen.map(c => c.side)), other = cand.filter(f => f.side !== 'Both' && !sides.has(f.side));
      chosen.push(other.length && Math.random() < 0.7 ? pick(other) : pick(cand)); // real incidents often span both teams
    }
    return chosen;
  };
  const healthy = st => NM.health(st).every(h => h.ok) && !NM.workarounds(st).length;
  /* returns { state, incident } where the state carries the planted faults; proven solvable before returning */
  NM.generate = (level, base) => {
    for (let attempt = 0; attempt < 25; attempt++) {
      const st = SIM.clone(base || NM.baseline()), faults = NM.faultsFor(level), planted = [];
      try { for (const f of faults) planted.push({ id: f.id, p: f.inject(st, level) || {} }); } catch (e) { continue; }
      if (healthy(st)) continue;                         // the faults must actually hurt something
      const proof = SIM.clone(st);
      for (const x of planted) NM.FAULTS.find(f => f.id === x.id).fix(proof, x.p);
      if (!healthy(proof)) continue;                     // and the known fixes must fully restore service
      const lead = NM.FAULTS.find(f => f.id === planted[0].id);
      return { state: st, incident: { level, planted, ticket: lead.ticket(planted[0].p), startedAt: Date.now(), hints: 0, status: 'open' } };
    }
    throw new Error('Nightmare: could not generate a solvable incident');
  };
  NM.fault = id => NM.FAULTS.find(f => f.id === id);
  /* three hints per incident, drawn across all planted faults */
  NM.hints = inc => {
    const lists = inc.planted.map(x => NM.fault(x.id).hints(x.p)), out = [];
    for (let i = 0; out.length < 3 && i < 3; i++) for (const l of lists) if (out.length < 3 && l[i]) out.push(l[i]);
    if (inc.planted.length > 1) out[0] = `There are ${inc.planted.length} separate problems in this incident. ` + out[0];
    return out;
  };
  NM.walkthrough = inc => inc.planted.map(x => { const f = NM.fault(x.id); return { title: f.title, side: f.side, steps: f.steps(x.p), why: f.why, ref: f.ref || '', source: f.ref ? NM.SOURCES[f.ref] || null : null }; });
  NM.applyFix = (st, inc) => { for (const x of inc.planted) NM.fault(x.id).fix(st, x.p); };
  NM.resolved = st => healthy(st);
  NM.points = inc => Math.max(10, 100 * inc.level - 15 * inc.hints - 5 * Math.floor((Date.now() - inc.startedAt) / 60000));
  return NM;
})();
if (typeof module !== 'undefined') module.exports = NIGHTMARE;

<script>
/* ================= INFRASTRUCTURE AS CODE: Terraform missions, the drift event, and a Nightmare drift incident =================
 * Appended to MISSIONS and NIGHTMARE.FAULTS from here so the base lists stay untouched. No DOM. */
(() => {
  const TF = SIM.TF, AZ = SIM.AZ;
  const lc = s => String(s == null ? '' : s).toLowerCase();
  const HUB = 'rg-talvex-hub-scus';
  const inState = (st, type, name, rg) => TF.ws(st).state.resources.find(r => r.type === type && lc(r.attrs.name) === lc(name) && (!rg || lc(r.attrs.resource_group_name || r.attrs.name) === lc(rg)));
  const status = st => TF.status(st);
  const touches = (st, addr) => { const s = status(st); return s.changes.some(c => c.addr === addr) || s.drift.some(d => d.addr === addr); };
  const subnetOf = (st, vn, sn) => { const v = AZ.vnetByName(st, vn); return v && AZ.subnet(v, sn); };
  const nsgApp = st => TF.nsg(st, HUB, 'nsg-snet-app');
  const RDP_RULE = 'Allow-RDP-Any';

  /* the out-of-band portal change that drives the drift mission. Returns an error string or null. */
  TF.injectDrift = st => {
    const w = TF.ws(st), n = nsgApp(st);
    if (w.drift) return 'already injected';
    if (!n) return 'nsg-snet-app does not exist';
    let pr = 110; while (n.rules.some(r => r.direction === 'Inbound' && r.priority === pr) && pr < 4096) pr++;
    const rule = { name: RDP_RULE, priority: pr, direction: 'Inbound', access: 'Allow', protocol: 'Tcp', source_port_range: '*', destination_port_range: '3389', source_address_prefix: '*', destination_address_prefix: '*', description: 'temp - need RDP from home, will remove later -Rick' };
    if (n.rules.some(r => lc(r.name) === lc(RDP_RULE))) return 'rule exists';
    const mark = st.azure.activity[0];
    const e = TF.addRule(st, n.rg, n.name, rule); if (e) return e;
    for (const a of st.azure.activity) { if (a === mark) break; a.by = 'rick@talvex.example'; }
    w.drift = { at: Date.now(), rule: RDP_RULE };
    return null;
  };

  const SPOKE_FIX = `{
  "terraform": { "required_providers": { "azurerm": { "source": "hashicorp/azurerm", "version": "~> 4.0" } } },
  "provider": { "azurerm": { "features": {}, "subscription_id": "<the ID on Azure → Home>" } },
  "variable": { "location": { "type": "string", "default": "southcentralus" } },
  "resource": {
    "azurerm_resource_group": { "spoke": { "name": "rg-talvex-spoke-scus", "location": "\${var.location}" } },
    "azurerm_virtual_network": { "spoke": {
      "name": "vnet-talvex-spoke",
      "resource_group_name": "\${azurerm_resource_group.spoke.name}",
      "location": "\${var.location}",
      "address_space": ["10.101.0.0/16"] } },
    "azurerm_subnet": { "web": {
      "name": "snet-web",
      "resource_group_name": "\${azurerm_resource_group.spoke.name}",
      "virtual_network_name": "\${azurerm_virtual_network.spoke.name}",
      "address_prefixes": ["10.101.1.0/24"] } }
  }
}`;

  const add = [
    {
      id: 'iac1', tier: 'Infrastructure as Code', view: 'azure', title: 'Open the workspace', type: 'config',
      story: 'Talvex wants the Azure side rebuilt as code before it grows any further: reviewed in pull requests, repeatable, and with a record of every change. Rick started a Terraform workspace and gave up. The first step on any Terraform workspace is always the same.',
      tasks: ['Azure view → Automation → Terraform.', 'Run terraform init in the console.', 'Read what it did: which provider, which version, and the lock file it wrote.'],
      hints: ['Type terraform init and press Enter, or click the init chip under the console.', 'init downloads the provider named in required_providers. "~> 4.0" means any 4.x, never 5.0.', 'The lock file (.terraform.lock.hcl) pins the exact version so everyone on the team gets the same one. Try cat .terraform.lock.hcl.'],
      why: 'Every Terraform run starts with init. Pinning the provider ("~> 4.0") and committing the lock file is what stops a teammate, or a pipeline, from silently picking up a new major version with different defaults.',
      cli: 'terraform init\ncat .terraform.lock.hcl\nterraform version',
      check: st => { const w = TF.ws(st); return [{ label: 'terraform init has run (lock file written)', ok: !!w.lock }, { label: 'hashicorp/azurerm 4.x is selected', ok: !!w.lock && /^4\./.test(w.lock.version) }]; }
    },
    {
      id: 'iac2', tier: 'Infrastructure as Code', view: 'azure', title: "Fix Rick's broken config", type: 'config',
      story: "Rick's main.tf.json describes a spoke network for the web tier: a resource group, a VNet and a subnet. It has never run. Some mistakes Terraform catches on its own, one needs a value from the subscription, and one only Azure will catch (that is the next mission).",
      tasks: ['Run terraform validate and fix every error it reports.', 'Run terraform plan until it prints a plan instead of an error.'],
      hints: ['validate reads the file against the provider schema: misspelled arguments and references to things that do not exist show up there, with a line number.', 'Look closely at "adress_space" and at which resource group the VNet points to.', 'plan also logs in to Azure. azurerm 4.x needs "subscription_id" in the provider block: copy it from Azure → Home.'],
      why: 'validate, plan and apply catch different kinds of mistakes. validate is offline and checks syntax and schema. plan talks to Azure and checks what exists. apply is the only one that asks Azure to actually build, so rules like "a subnet must sit inside its VNet" only surface there.',
      cli: 'terraform validate\nterraform plan\n\n# main.tf.json after the fixes (the subnet range is still wrong on purpose):\n' + SPOKE_FIX.replace('10.101.1.0/24', '10.110.1.0/24'),
      check: st => { const s = status(st); return [{ label: 'terraform validate passes', ok: s.valid && !!TF.ws(st).lock }, { label: 'terraform plan runs without errors', ok: s.planOk }]; }
    },
    {
      id: 'iac3', tier: 'Infrastructure as Code', view: 'azure', title: 'Ship the spoke with code', type: 'config',
      story: 'The plan looks right. Apply it. When Azure pushes back, read the error, fix the code (not the portal) and apply again. Terraform keeps whatever already succeeded.',
      tasks: ['terraform apply (type yes to approve).', 'Azure must end up with rg-talvex-spoke-scus, vnet-talvex-spoke (10.101.0.0/16) and subnet snet-web (10.101.1.0/24), all in South Central US and all in the Terraform state.', 'Finish with terraform plan reporting "No changes".'],
      hints: ['The first apply fails on the subnet. Read the NetcfgInvalidSubnet message: which range is the subnet in, and which range is the VNet?', '10.110.1.0/24 is not inside 10.101.0.0/16. The design says snet-web is 10.101.1.0/24.', 'After the fix, apply again. Terraform only creates what is missing; the resource group and VNet are already in the state.'],
      why: 'A failed apply is not a rollback. Terraform records what succeeded and picks up from there next time, which is why you fix forward in code instead of cleaning up by hand in the portal.',
      cli: 'terraform apply\n\n# the finished main.tf.json:\n' + SPOKE_FIX,
      check: st => {
        const rg = AZ.rg(st, 'rg-talvex-spoke-scus'), v = AZ.vnetByName(st, 'vnet-talvex-spoke'), s = subnetOf(st, 'vnet-talvex-spoke', 'snet-web');
        return [
          { label: 'rg-talvex-spoke-scus exists and Terraform manages it', ok: !!rg && rg.location === 'southcentralus' && !!inState(st, 'azurerm_resource_group', 'rg-talvex-spoke-scus') },
          { label: 'vnet-talvex-spoke is 10.101.0.0/16 and Terraform manages it', ok: !!v && v.addressSpace.length === 1 && v.addressSpace[0].ip === '10.101.0.0' && v.addressSpace[0].bits === 16 && !!inState(st, 'azurerm_virtual_network', 'vnet-talvex-spoke') },
          { label: 'snet-web is 10.101.1.0/24 and Terraform manages it', ok: !!s && s.ip === '10.101.1.0' && s.bits === 24 && !!inState(st, 'azurerm_subnet', 'snet-web') },
          { label: 'terraform plan: No changes', ok: status(st).clean }
        ];
      }
    },
    {
      id: 'iac4', tier: 'Infrastructure as Code', view: 'azure', title: 'Bring the hub under management', type: 'config',
      story: 'The hub (rg-talvex-hub-scus and vnet-talvex-hub) was built by hand in the portal during Azure Foundations. Terraform does not know it exists. Writing the blocks and running apply will not work: Azure already has those names. Import them instead, so the code takes over the real thing without touching it.',
      tasks: ['Add an azurerm_resource_group "hub" and an azurerm_virtual_network "hub" to main.tf.json that describe the hub exactly as it is.', 'terraform import each one using its Azure resource ID (listed on the Terraform page).', 'terraform plan must not want to change, replace or destroy either of them.'],

  };
  const NAV = [

  const pageTitle = p => { if (p === 'az-vnet') return ['Networking', 'Virtual network']; for (const g of NAV.concat(AZNAV)) for (const i of g.items) if (i[0] === p) return [g.grp || '', i[1]]; return ['', '']; };

  const actBtn = (act, id, icon, title) => `<button class="ibtn" data-act="${act}" data-id="${esc(id)}" title="${esc(title)}" aria-label="${esc(title)}">${icon}</button>`;

  const tabs = (key, list) => { const cur = UI.tab[key] || list[0][0]; return `<div class="tabs" role="tablist">${list.map(([k, l]) => `<button role="tab" class="${k === cur ? 'on' : ''}" data-act="tab" data-key="${key}" data-id="${k}">${esc(l)}</button>`).join('')}</div>`; };
  const curTab = (key, def) => UI.tab[key] || def;
  const svcDetail = s => s.any ? 'ALL' : [s.icmp ? 'ICMP' : '', ...(s.tcp || []).map(([a, b]) => `TCP/${a === b ? a : a + '-' + b}`), ...(s.udp || []).map(([a, b]) => `UDP/${a === b ? a : a + '-' + b}`)].filter(Boolean).join(' ');
  const ifOpts = (incAny) => (incAny ? ['any'] : []).concat(SIM.ifaceNames(S));

  /* ================= PAGES ================= */

  /* ---------- live topology: every link comes from the same engine the lab runs on ---------- */
  function topoHtml() {

    let e2e = null; try { e2e = SIM.lookup(S, { srcintf: lan.name || 'port2', srcip: '10.10.10.20', dstip: vm ? vm.privateIp : '10.100.1.4', proto: 'tcp', port: 443 }); } catch (e) { }
    const flow = !!(e2e && e2e.verdict === 'accept' && e2e.far && e2e.far.ok);
    const st = x => x === true ? 'ok' : x === false ? 'bad' : 'mute';
    const links = [
      { a: 0, b: 1, s: st(lan.status === 'up'), tip: `${lan.name || 'LAN'} ${lan.ip || ''}/${lan.bits || ''} is ${lan.status || 'missing'}` },

      { a: 3, b: 4, s: vm ? st(vm.power === 'running') : 'mute', tip: vm ? `${vm.name} (${vm.privateIp}) is ${vm.power}` : 'No VM at 10.100.1.4 yet' }

    ];

    }

    return `<section class="card widget topo-card"><div class="topo-head"><h2>Live topology</h2>${flow ? pill('Traffic flows end to end', 'ok') : pill('End-to-end path broken', 'bad')}<span class="muted topo-hint">Click a box to open it. Hover a link for its exact status.</span></div>

  }
  P.dashboard = () => {

    return head('Status of the Talvex perimeter firewall. Everything here is a simulation: change it freely, it cannot break anything real.') + `
    <div class="dash">${topoHtml()}
      <section class="card widget"><h2>System Information</h2><dl class="kv">

      <section class="card widget" style="grid-column:1/-1"><h2>Recent System Events</h2><div class="evt">${S.logs.event.slice(0, 7).map(e => `<span class="muted num mono">${fmtTs(e.ts)}</span><span>${pill(e.level, e.level === 'alert' ? 'bad' : e.level === 'warning' ? 'warn' : e.level === 'notice' ? 'info' : 'mute')} ${esc(e.msg)}</span>`).join('')}</div></section>

  P.interfaces = () => {

      <td>${chips(p.srcintf)}</td><td>${chips(p.dstintf)}</td><td>${chips(p.srcaddr)}</td><td>${chips(p.dstaddr)}</td><td>${chips(p.service)}</td>
      <td>${pill(p.action === 'accept' ? 'ACCEPT' : 'DENY', p.action === 'accept' ? 'ok' : 'bad')}</td>
      <td>${p.action === 'accept' ? (p.nat ? pill('NAT', 'info') : '<span class="muted">Off</span>') : ''}</td>
      <td>${chips(prof(p), '')}</td><td>${logTxt[p.logtraffic]}</td><td class="num">${esc(Number(p.hits || 0).toLocaleString())}</td>

    return head('Policies are checked from the top down. The first one that matches decides what happens. Anything that matches nothing is dropped by the implicit deny.') +
      lookupCard() +
      `<div class="toolbar"><button class="btn primary" data-act="pol-new">${I.plus} Create New</button><span class="help">Sequence order is what matters, not the ID number. Use the arrows to reorder.</span></div>
      <div class="tablewrap"><table class="grid"><thead><tr><th></th><th>Seq</th><th>ID</th><th>Name</th><th>From</th><th>To</th><th>Source</th><th>Destination</th><th>Service</th><th>Action</th><th>NAT</th><th>Security Profiles</th><th>Log</th><th>Hits</th><th>Status</th><th></th></tr></thead><tbody>${rows}

  };
  function lookupCard() {
