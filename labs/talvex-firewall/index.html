      <section class="card widget"><h2>Reset lab</h2><p class="help" style="margin-top:0">Puts the firewall back to how the old IT guy left it and clears mission progress.</p><button class="btn danger" data-act="bk-reset">Reset lab…</button></section>
      <section class="card widget" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>Full configuration (CLI)</h2><button class="btn" data-act="bk-copycli">${I.copy} Copy</button></div><pre class="mono" style="margin:10px 0 0;max-height:420px;overflow:auto;background:var(--term-bg);color:var(--term-ink);padding:12px;border-radius:6px;font-size:12px" id="fullCfg">${esc(full)}</pre></section></div>`;
  };

  P.sessions = () => {
    const f = (UI.filter || '').toLowerCase();
    const now = Date.now();
    const rows = S.sessions.filter(x => !f || `${x.srcip} ${x.dstip} ${x.srcintf} ${x.dstintf} ${x.app} ${x.port} ${x.policyid}`.toLowerCase().includes(f));
    const bySrc = {}; S.sessions.forEach(x => { bySrc[x.srcip] = (bySrc[x.srcip] || 0) + 1; });
    const top = Object.entries(bySrc).sort((a, b) => b[1] - a[1]).slice(0, 5);
    return head('Sessions the firewall is forwarding right now. Killing a session ends it; if the host is still allowed by policy, it can start a new one.') +
      `<div class="toolbar"><input class="search" id="sessFilter" placeholder="Filter (IP, interface, app, policy)…" value="${esc(UI.filter)}" aria-label="Filter sessions"><span class="help num">${S.sessions.length} active · refreshes live</span><span class="grow"></span><span class="help">Top talkers: ${top.map(([ip, n]) => `<span class="chip ref">${esc(ip)} ×${n}</span>`).join(' ') || '-'}</span></div>
      <div class="tablewrap"><table class="grid"><thead><tr><th>Source</th><th>Src Intf</th><th>Destination</th><th>Dst Intf</th><th>Application</th><th>Policy</th><th>NAT</th><th>Duration</th><th>Bytes</th><th></th></tr></thead><tbody>${rows.map(x => `<tr><td class="mono">${esc(x.srcip)}${SIM.HOSTS[x.srcip] ? `<div class="help">${esc(SIM.HOSTS[x.srcip])}</div>` : ''}</td><td class="mono">${esc(x.srcintf)}</td><td class="mono">${esc(x.dstip)}:${x.port}${SIM.HOSTS[x.dstip] ? `<div class="help">${esc(SIM.HOSTS[x.dstip])}</div>` : ''}</td><td class="mono">${esc(x.dstintf)}</td><td>${esc(x.app)}</td><td class="num">${esc(x.policyid)}</td><td class="mono">${esc(x.nat)}</td><td class="num">${fmtElapsed(now - x.ts)}</td><td class="num">${esc(Number(x.bytes).toLocaleString())}</td><td class="acts"><button class="btn danger" style="height:26px" data-act="sess-kill" data-id="${esc(x.id)}">Kill</button></td></tr>`).join('') || '<tr><td colspan="10" class="empty">No active sessions match.</td></tr>'}</tbody></table></div>`;
  };
  P.logs = () => {
    const t = curTab('logs', 'traffic');
    const f = (UI.filter || '').toLowerCase();
    const match = o => !f || JSON.stringify(o).toLowerCase().includes(f);
    let body;
    if (t === 'traffic') {
      const rows = S.logs.traffic.filter(match).slice(0, 250);
      body = `<div class="tablewrap"><table class="grid"><thead><tr><th>Date/Time</th><th>Src Intf</th><th>Source</th><th>Dst Intf</th><th>Destination</th><th>Service</th><th>Policy</th><th>Action</th><th>NAT IP</th><th>Message</th></tr></thead><tbody>${rows.map(l => `<tr><td class="mono num">${fmtTs(l.ts)}</td><td class="mono">${esc(l.srcintf)}</td><td class="mono">${esc(l.srcip)}</td><td class="mono">${esc(l.dstintf)}</td><td class="mono">${esc(l.dstip)}</td><td class="mono">${esc(l.proto.toUpperCase() + (l.proto === 'icmp' ? '' : '/' + l.port))}</td><td class="num">${esc(l.policyid)}</td><td>${pill(l.action, l.action === 'accept' ? 'ok' : 'bad')}</td><td class="mono">${esc(l.nat)}</td><td>${esc(l.msg)}</td></tr>`).join('') || '<tr><td colspan="10" class="empty">No matching log entries.</td></tr>'}</tbody></table></div>`;
    } else if (t === 'local') {
      const rows = S.logs.local.filter(match).slice(0, 200);
      body = `<p class="help">Traffic addressed to the firewall itself (management access, ping).</p><div class="tablewrap"><table class="grid"><thead><tr><th>Date/Time</th><th>Interface</th><th>Source</th><th>Destination</th><th>Service</th><th>Action</th><th>Message</th></tr></thead><tbody>${rows.map(l => `<tr><td class="mono num">${fmtTs(l.ts)}</td><td class="mono">${esc(l.srcintf)}</td><td class="mono">${esc(l.srcip)}</td><td class="mono">${esc(l.dstip)}</td><td class="mono">${esc(String(l.proto).toUpperCase() + '/' + l.port)}</td><td>${pill(l.action, l.action === 'accept' ? 'ok' : 'bad')}</td><td>${esc(l.msg)}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">No matching log entries.</td></tr>'}</tbody></table></div>`;
    } else {
      const rows = S.logs.event.filter(match).slice(0, 200);
      body = `<div class="tablewrap"><table class="grid"><thead><tr><th>Date/Time</th><th>Level</th><th>Message</th></tr></thead><tbody>${rows.map(e => `<tr><td class="mono num">${fmtTs(e.ts)}</td><td>${pill(e.level, e.level === 'alert' ? 'bad' : e.level === 'warning' ? 'warn' : e.level === 'notice' ? 'info' : 'mute')}</td><td>${esc(e.msg)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No matching events.</td></tr>'}</tbody></table></div>`;
    }
    return head('Forward traffic, local traffic and system events. Newest first.') + tabs('logs', [['traffic', 'Forward Traffic'], ['local', 'Local Traffic'], ['event', 'System Events']]) +
      `<div class="toolbar"><input class="search" id="logFilter" placeholder="Filter (IP, policy, text)…" value="${esc(UI.filter)}" aria-label="Filter logs"></div>` + body;
  };

  /* ================= AZURE PAGES ================= */
  /* Every value from st.azure is passed through esc(); ids for data-* attributes are "rg/name" (no Azure name can contain "/"). */
  const AZ = SIM.AZ;
  const azRegion = c => esc(AZ.regionName(c));
  const banner = (kind, text) => `<div class="banner ${kind}" role="status">${esc(text)}</div>`;
  const azLink = (act, id, text) => `<button class="linkbtn" data-act="${act}" data-id="${esc(id)}">${esc(text)}</button>`;
  const azWarnings = () => { const out = []; for (const v of S.azure.vnets) for (const a of v.addressSpace) for (const w of AZ.prefixWarnings(S, a, v)) out.push(`${v.name}: ${w}`); return out; };
  const azFilter = (ph) => `<input class="search" id="azFilter" placeholder="${esc(ph)}" value="${esc(UI.filter)}" aria-label="Filter">`;
  const fmatch = (...vals) => { const f = (UI.filter || '').toLowerCase(); return !f || vals.join(' ').toLowerCase().includes(f); };
  const vmStatus = m => pill(m.power === 'running' ? 'Running' : 'Stopped (deallocated)', m.power === 'running' ? 'ok' : 'mute');
  const curVnet = () => { const [rg, n] = String(UI.azVnet || '').split('/'); return AZ.vnet(S, rg, n); };

  P['az-home'] = () => {
    const z = S.azure, warn = azWarnings();
    const ams = MISSIONS.filter(m => m.view === 'azure'), ad = ams.filter(isDone).length;
    const subnets = z.vnets.reduce((n, v) => n + v.subnets.length, 0), running = z.vms.filter(m => m.power === 'running').length;
    return head('A simulated Azure subscription with real Azure names, limits and validation. Build the hub here, break it freely, then port the design to a live subscription.') + warn.map(w => banner('warn', w)).join('') + `
    <div class="dash">${topoHtml()}
      <section class="card widget"><h2>Subscription</h2><dl class="kv">
        <dt>Name</dt><dd>${esc(z.subscription.name)}</dd><dt>Subscription ID</dt><dd class="mono">${esc(z.subscription.id)}</dd>
        <dt>Signed in as</dt><dd class="mono">${esc(AZ.USER)}</dd><dt>Plan region</dt><dd>South Central US</dd></dl></section>
      <section class="card widget"><h2>Resources</h2><dl class="kv">
        <dt>Resource groups</dt><dd class="num">${z.resourceGroups.length}</dd><dt>Virtual networks</dt><dd class="num">${z.vnets.length}</dd>
        <dt>Subnets</dt><dd class="num">${subnets}</dd><dt>Virtual machines</dt><dd class="num">${z.vms.length} (${running} running)</dd></dl>
        <p style="margin:12px 0 0"><button class="btn" data-act="nav" data-id="az-resources">${I.list} All resources</button></p></section>
      <section class="card widget"><h2>Azure Foundations</h2><p style="margin:0 0 8px"><b class="num" style="font-size:22px">${ad}</b> <span class="muted">of ${ams.length} Azure missions complete</span></p><div class="meter"><i style="width:${ams.length ? Math.round(ad / ams.length * 100) : 0}%;background:var(--ok)"></i></div><p style="margin:12px 0 0"><button class="btn primary" data-act="open-missions">${I.flag} Open missions</button></p></section>
      <section class="card widget" style="grid-column:1/-1"><h2>Recent activity</h2>${azActivityTable(z.activity.slice(0, 6))}</section>
    </div>`;
  };
  const azActivityTable = rows => `<div class="tablewrap"><table class="grid"><thead><tr><th>Operation name</th><th>Status</th><th>Time</th><th>Resource</th><th>Resource group</th><th>Event initiated by</th></tr></thead><tbody>${rows.map(a => `<tr><td>${esc(a.op)}</td><td>${pill(a.status, a.status === 'Succeeded' ? 'ok' : 'bad')}</td><td class="mono num">${fmtTs(a.ts)}</td><td class="mono">${esc(a.resource)}</td><td class="mono">${esc(a.rg)}</td><td class="mono">${esc(a.by)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No activity.</td></tr>'}</tbody></table></div>`;

  P['az-resources'] = () => {
    const z = S.azure, rgf = UI.azRg;
    const rows = [].concat(
      z.vnets.map(v => ({ name: v.name, type: 'Virtual network', rg: v.rg, loc: v.location, open: ['az-vnet-open', `${v.rg}/${v.name}`] })),
      (z.gateways || []).map(g => ({ name: g.name, type: 'Virtual network gateway', rg: g.rg, loc: g.location, open: ['nav', 'az-vpn'] })),
      (z.lngs || []).map(g => ({ name: g.name, type: 'Local network gateway', rg: g.rg, loc: g.location, open: ['nav', 'az-vpn'] })),
      (z.connections || []).map(g => ({ name: g.name, type: 'Connection', rg: g.rg, loc: g.location, open: ['nav', 'az-vpn'] })),
      z.vms.map(m => ({ name: m.name, type: 'Virtual machine', rg: m.rg, loc: m.location, open: ['nav', 'az-vms'] })),
      (z.nsgs || []).map(n => ({ name: n.name, type: 'Network security group', rg: n.rg, loc: n.location, open: ['nav', 'az-nsgs'] })),
      z.vms.map(m => ({ name: `${m.name}-nic`, type: 'Network interface', rg: m.rg, loc: m.location }))
    ).filter(r => (!rgf || r.rg.toLowerCase() === rgf.toLowerCase()) && fmatch(r.name, r.type, r.rg, r.loc));
    return head('Every resource in the subscription. Creating a VM also creates its network interface (NIC); the NIC is what actually sits in a subnet.') +
      `<div class="toolbar">${azFilter('Filter by name, type, group…')}<select class="search" id="azRgFilter" aria-label="Resource group filter" style="width:auto"><option value="">All resource groups</option>${z.resourceGroups.map(r => `<option value="${esc(r.name)}" ${rgf && r.name.toLowerCase() === rgf.toLowerCase() ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select><span class="help num">${rows.length} resource(s)</span></div>
      <div class="tablewrap"><table class="grid"><thead><tr><th>Name</th><th>Type</th><th>Resource group</th><th>Location</th></tr></thead><tbody>${rows.map(r => `<tr><td class="mono">${r.open ? azLink(r.open[0], r.open[1], r.name) : esc(r.name)}</td><td>${esc(r.type)}</td><td class="mono">${esc(r.rg)}</td><td>${azRegion(r.loc)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No resources match.</td></tr>'}</tbody></table></div>`;
  };

  P['az-rgs'] = () => {
    const z = S.azure;
    const count = rg => z.vnets.filter(v => v.rg.toLowerCase() === rg.toLowerCase()).length + z.vms.filter(m => m.rg.toLowerCase() === rg.toLowerCase()).length * 2;
    return head('A resource group is a container for resources that share a lifecycle. Access, policy and cost roll up to it, and deleting it deletes everything inside.') +
      `<div class="toolbar"><button class="btn primary" data-act="az-rg-new">${I.plus} Create</button></div>
      <div class="tablewrap"><table class="grid"><thead><tr><th>Name</th><th>Location</th><th>Resources</th><th>Created</th><th></th></tr></thead><tbody>${z.resourceGroups.map(r => `<tr><td class="mono">${azLink('az-rg-open', r.name, r.name)}</td><td>${azRegion(r.location)}</td><td class="num">${count(r.name)}</td><td class="mono num">${fmtTs(r.created)}</td><td class="acts">${actBtn('az-rg-del', r.name, I.del, 'Delete resource group')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No resource groups. Create one to start.</td></tr>'}</tbody></table></div>`;
  };

  P['az-vnets'] = () => {
    const z = S.azure;
    const rows = z.vnets.filter(v => fmatch(v.name, v.rg, v.location, v.addressSpace.map(AZ.fmt).join(' ')));
    return head('A virtual network (VNet) is your private address space in Azure. Subnets carve it up; every VM NIC, gateway and firewall lives in a subnet.') +
      `<div class="toolbar"><button class="btn primary" data-act="az-vnet-new">${I.plus} Create</button>${azFilter('Filter virtual networks…')}</div>
      <div class="tablewrap"><table class="grid"><thead><tr><th>Name</th><th>Resource group</th><th>Location</th><th>Address space</th><th>Subnets</th><th></th></tr></thead><tbody>${rows.map(v => { const warn = v.addressSpace.some(a => AZ.prefixWarnings(S, a, v).length); return `<tr><td class="mono">${azLink('az-vnet-open', `${v.rg}/${v.name}`, v.name)}${warn ? ' ' + pill('Overlap', 'warn') : ''}</td><td class="mono">${esc(v.rg)}</td><td>${azRegion(v.location)}</td><td>${chips(v.addressSpace.map(AZ.fmt))}</td><td class="num">${v.subnets.length}</td><td class="acts">${actBtn('az-vnet-del', `${v.rg}/${v.name}`, I.del, 'Delete virtual network')}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">No virtual networks.</td></tr>'}</tbody></table></div>`;
  };

  P['az-vnet'] = () => {
    const v = curVnet();
    if (!v) return P['az-vnets']();
    const id = `${v.rg}/${v.name}`, t = curTab('azvnet', 'overview');
    const warn = [].concat(...v.addressSpace.map(a => AZ.prefixWarnings(S, a, v)));
    const vms = AZ.vmsIn(S, v);
    let body;
    if (t === 'overview') {
      body = warn.map(w => banner('warn', w)).join('') + `<section class="card widget"><h2>Essentials</h2><dl class="kv">
        <dt>Resource group</dt><dd class="mono">${esc(v.rg)}</dd><dt>Location</dt><dd>${azRegion(v.location)}</dd>
        <dt>Subscription</dt><dd>${esc(S.azure.subscription.name)}</dd><dt>Address space</dt><dd class="mono">${esc(v.addressSpace.map(AZ.fmt).join(', '))}</dd>
        <dt>Subnets</dt><dd class="num">${v.subnets.length}</dd><dt>Connected devices</dt><dd class="num">${vms.length}</dd><dt>Created</dt><dd class="mono num">${fmtTs(v.created)}</dd></dl></section>`;
    } else if (t === 'space') {
      body = warn.map(w => banner('warn', w)).join('') + `<div class="toolbar"><button class="btn primary" data-act="az-pfx-new" data-id="${esc(id)}">${I.plus} Add address space</button><span class="help">A VNet can have several non-overlapping ranges. Every subnet must sit inside one of them.</span></div>
        <div class="tablewrap"><table class="grid"><thead><tr><th>Address space</th><th>Address range</th><th>Address count</th><th>Subnets inside</th><th></th></tr></thead><tbody>${v.addressSpace.map(a => { const i = AZ.subnetInfo(a); return `<tr><td class="mono">${esc(AZ.fmt(a))}</td><td class="mono">${esc(a.ip)} - ${esc(i.broadcast)}</td><td class="num">${i.total.toLocaleString()}</td><td class="num">${v.subnets.filter(s => AZ.contains(a, s)).length}</td><td class="acts"><button class="ibtn" data-act="az-pfx-del" data-id="${esc(id)}" data-name="${esc(AZ.fmt(a))}" title="Remove address space" aria-label="Remove address space ${esc(AZ.fmt(a))}">${I.del}</button></td></tr>`; }).join('')}</tbody></table></div>`;
    } else if (t === 'subnets') {
      body = `<div class="toolbar"><button class="btn primary" data-act="az-sub-new" data-id="${esc(id)}">${I.plus} Subnet</button><span class="help">Azure reserves 5 addresses in every subnet: the first four and the last.</span></div>
        <div class="tablewrap"><table class="grid"><thead><tr><th>Name</th><th>IPv4</th><th>Usable range</th><th>Available IPs</th><th>Devices</th><th></th></tr></thead><tbody>${v.subnets.map(s => { const i = AZ.subnetInfo(s), u = AZ.usage(S, v, s); return `<tr><td class="mono">${esc(s.name)}${AZ.SPECIAL[s.name] ? `<div class="help">reserved for ${esc(AZ.SPECIAL[s.name].purpose)}</div>` : ''}</td><td class="mono">${esc(AZ.fmt(s))}</td><td class="mono">${esc(i.first)} - ${esc(i.last)}</td><td class="num">${u.available}</td><td class="num">${u.used}</td><td class="acts">${actBtn('az-sub-del', `${id}/${s.name}`, I.del, 'Delete subnet')}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">No subnets yet.</td></tr>'}</tbody></table></div>`;
    } else {
      body = `<div class="tablewrap"><table class="grid"><thead><tr><th>Device</th><th>Type</th><th>IP address</th><th>Subnet</th><th>Attached to</th></tr></thead><tbody>${vms.map(m => `<tr><td class="mono">${esc(m.name)}-nic</td><td>Network interface</td><td class="mono">${esc(m.privateIp)} <span class="help">(${esc(m.ipAlloc)})</span></td><td class="mono">${esc(m.subnet)}</td><td class="mono">${esc(m.name)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nothing is connected to this virtual network.</td></tr>'}</tbody></table></div>`;
    }
    return `<div class="crumb">Azure › Networking › Virtual networks</div><h1>${esc(v.name)}</h1><p class="lede">Virtual network · ${esc(v.rg)} · ${azRegion(v.location)}</p>
      <div class="toolbar"><button class="btn" data-act="nav" data-id="az-vnets">← All virtual networks</button><span class="grow"></span><button class="btn danger" data-act="az-vnet-del" data-id="${esc(id)}">${I.del} Delete</button></div>` +
      tabs('azvnet', [['overview', 'Overview'], ['space', 'Address space'], ['subnets', 'Subnets'], ['devices', 'Connected devices']]) + body;
  };

  P['az-vms'] = () => {
    const z = S.azure;
    const rows = z.vms.filter(m => fmatch(m.name, m.rg, m.privateIp, m.vnet, m.subnet, m.location));
    return head('Virtual machines and the private IP their NIC holds. Stopping (deallocating) a VM stops compute billing; its private IP stays reserved.') +
      `<div class="toolbar"><button class="btn primary" data-act="az-vm-new">${I.plus} Create</button>${azFilter('Filter virtual machines…')}</div>
      <div class="tablewrap"><table class="grid"><thead><tr><th>Name</th><th>Status</th><th>Resource group</th><th>Location</th><th>Image</th><th>Size</th><th>Private IP</th><th>Virtual network / subnet</th><th></th></tr></thead><tbody>${rows.map(m => { const img = AZ.image(m.image); const id = `${m.rg}/${m.name}`; return `<tr><td class="mono">${esc(m.name)}</td><td>${vmStatus(m)}</td><td class="mono">${esc(m.rg)}</td><td>${azRegion(m.location)}</td><td>${esc(img ? img.label : m.image)}</td><td class="mono">${esc(m.size)}</td><td class="mono">${esc(m.privateIp)} <span class="help">(${esc(m.ipAlloc)})</span></td><td class="mono">${esc(m.vnet)} / ${esc(m.subnet)}</td><td class="acts">${m.power === 'running' ? `<button class="ibtn" data-act="az-vm-power" data-id="${esc(id)}" data-name="deallocated" title="Stop" aria-label="Stop ${esc(m.name)}">${I.stop}</button>` : `<button class="ibtn" data-act="az-vm-power" data-id="${esc(id)}" data-name="running" title="Start" aria-label="Start ${esc(m.name)}">${I.play}</button>`}${actBtn('az-vm-del', id, I.del, 'Delete virtual machine')}</td></tr>`; }).join('') || '<tr><td colspan="9" class="empty">No virtual machines.</td></tr>'}</tbody></table></div>`;
  };

  P['az-vpn'] = () => {
    const z = AZ.hy(S), g = z.gateways[0], l = z.lngs[0], c = z.connections[0], cs = SIM.azConn(S), now = Date.now();
    const kv = rows => `<dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;
    const btn = (act, label, id, primary) => `<button class="btn${primary ? ' primary' : ''}" data-act="${act}"${id ? ` data-id="${esc(id)}"` : ''}>${label}</button>`;
    const state = g ? (AZ.gwReady(g) ? pill('Succeeded', 'ok') : pill(`Updating, about ${Math.max(1, Math.ceil((g.readyAt - now) / 1000))}s left`, 'warn')) : '';
    const gwCard = g ? `<section class="card widget"><h2>Virtual network gateway</h2>${kv([
        ['Name', `<span class="mono">${esc(g.name)}</span>`], ['Provisioning state', state], ['SKU', esc(g.sku)], ['Virtual network', `${esc(g.vnet)} (${esc(g.rg)})`],
        ['Public IP address', `<span class="mono">${esc(g.publicIp)}</span>`], ['BGP', g.bgp ? `On, ASN <span class="mono">${esc(g.asn)}</span>, peer IP <span class="mono">${esc(AZ.gwBgpIp(S, g) || '')}</span>` : 'Off']])}
        <div class="toolbar">${btn('az-gw-edit', 'Configuration', g.name)}${btn('az-gw-del', 'Delete', g.name)}</div></section>`
      : `<section class="card widget"><h2>Virtual network gateway</h2><p class="muted">No VPN gateway yet. It deploys into the hub's GatewaySubnet and gives Azure a public IP for the tunnel.</p><div class="toolbar">${btn('az-gw-new', I.plus + ' Create', '', true)}</div></section>`;
    const lngCard = l ? `<section class="card widget"><h2>Local network gateway</h2>${kv([

    const v = viewOf(p); if (v !== UI.view) UI.filter = '';
    UI.view = v; UI.last[v] = p; UI.page = p; $('#main').scrollTop = 0; $('#rail').classList.remove('open'); renderAll();
  }
  function switchView(v) { go(UI.last[v === 'azure' ? 'azure' : 'fg']); }
  $('#vFG').addEventListener('click', () => switchView('fg'));
  $('#vAZ').addEventListener('click', () => switchView('azure'));
  $('#rail').addEventListener('click', e => { const a = e.target.closest('a[data-page]'); if (!a) return; e.preventDefault(); go(a.dataset.page); });
  window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (p && p !== UI.page) go(p); });
  $('#menuBtn').addEventListener('click', () => $('#rail').classList.toggle('open'));
  $('#misBtn').addEventListener('click', () => { const open = UI.drawer && UI.drawerMode !== 'nm'; UI.drawerMode = 'missions'; UI.drawer = !open; renderAll(); });
  $('#nmBtn').addEventListener('click', () => { const open = UI.drawer && UI.drawerMode === 'nm'; UI.drawerMode = 'nm'; UI.drawer = !open; renderAll(); });
  $('#lookupBtn').addEventListener('click', () => { go('policy'); setTimeout(() => { const c = $('#lookupCard'); if (c) { c.scrollIntoView({ block: 'start' }); const i = $('#lk_srcip'); if (i) i.focus(); } }, 30); });

  // boot
  evaluate(true);
  UI.page = PAGES.includes(location.hash.slice(1)) && location.hash.slice(1) !== 'az-vnet' ? location.hash.slice(1) : 'dashboard';
  UI.view = viewOf(UI.page); UI.last[UI.view] = UI.page;
  UI.drawer = window.innerWidth > 1100;
  { const first = MISSIONS.find(m => !isDone(m)); UI.open = first ? first.id : null; }
  renderAll(); renderTerm();
  $('#saveDot').className = 'save-dot offline';

  const liveSet = new Set(['dashboard', 'logs', 'sessions', 'policy']);
  let lastDone = -1;
  function onTick() {
    evaluate();
    const ae = document.activeElement; const typing = ae && ae.closest && ae.closest('#main') && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
    if (liveSet.has(UI.page) && !typing && !selHeld($('#main'))) renderMain();
    renderHeader();
    const d = doneCount();
    const inDrawer = ae && ae.closest && ae.closest('#drawer') && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
    const anyThreat = LIVE.THREATS.some(t => (S.threats[t.id] || {}).active);
    if (UI.drawer && !inDrawer && (d !== lastDone || anyThreat) && !selHeld($('#drawer'))) { renderDrawer(); lastDone = d; }
    else if (!UI.drawer) lastDone = d;
  }
  function onThreat(t) { toast('New activity in the logs', `${t.name}. A new Live Threats mission is open.`, 'bad'); SIM.event(S, 'system', 'warning', `Anomaly detector: unusual traffic pattern observed (${t.name.toLowerCase()})`); }
  function startLab() {
    UI.started = true; $('#startRoot').innerHTML = '';
    LIVE.start(S, { onTick, onThreat, onAzure: () => { toast('Tunnel down', 'The Azure team applied a custom IPsec/IKE policy. See the follow-up mission.', 'bad'); renderAll(); } });
    toast('Traffic is flowing', 'Logs, sessions and hit counts now update live.');
  }
  $('#startRoot').innerHTML = `<div class="modal-back"><div class="modal start" role="dialog" aria-modal="true" aria-label="Start the lab"><header><h2>Talvex Firewall Lab</h2></header><div class="body">
    <p style="margin:0">You are taking over the Talvex Components firewall as the old IT guy left it. The ${MISSIONS.length} missions walk you from reading the logs to a hardened box with a site-to-site tunnel into Azure, and then into building the Azure side itself, while live traffic and a few live attackers keep the logs moving.</p>
    <div class="notice"><b>Nothing is saved.</b> Closing or reloading this page resets the firewall, the missions and the traffic. Plan on one sitting of about 60 to 75 minutes. If you must step away, System → Backup &amp; Reset can copy your config to paste back later.</div>
    <ul style="margin:0;padding-left:18px"><li>Missions open on the right. Checks run live as you work.</li><li>Policy Lookup shows which rule handles any packet.</li><li>The CLI button opens a console that shares the same config.</li><li>The FortiGate | Azure switch at the top flips between the firewall and a simulated Azure subscription.</li><li>New threats unlock as you progress. Watch the logs.</li><li>The FortiGate and Azure sides are live: build your own Azure VPN gateway and both ends negotiate for real.</li><li>Want it harder? <b>Nightmare</b> (top bar) throws random, escalating production incidents at you.</li></ul><p style="margin:12px 0 0;font-size:12px;opacity:.75">Independent training simulation by Joshua Richard. Not affiliated with or endorsed by Fortinet; FortiGate, FortiOS and FortiGuard are trademarks of Fortinet, Inc. Talvex is a fictional company and all data here is made up. <a href="../../">Back to the portfolio</a></p>
  </div><footer><button class="btn primary" id="startBtn" type="button">Start the lab</button></footer></div></div>`;
  $('#startBtn').addEventListener('click', startLab);
  $('#startBtn').focus();

  /* Node test hook: inert in the browser (nothing defines __labTestHook). tests/ui-render.test.js uses it
     to render every page from hostile state and run actions without a real DOM. */
  if (typeof window !== 'undefined' && typeof window.__labTestHook === 'function') {
    window.__labTestHook({ P, A, ED, UI, NMS, go, valid, renderMain, renderAll, renderDrawer, saveForm, form: () => F, get S() { return S; }, set S(x) { S = x; } });
  }
})();
